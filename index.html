<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tebak Kata Kerja Jepang</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700&family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">
<style>
    :root { --primary: #ec4899; --primary-dark: #be185d; --secondary: #d946ef; --success: #10b981; --danger: #ef4444; --text: #831843; }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    body { 
        font-family: 'Poppins', sans-serif; 
        background: linear-gradient(135deg, #fce7f3 0%, #fdf2f8 100%); 
        min-height: 100vh; 
        display: flex; 
        flex-direction: column;
        justify-content: center; 
        align-items: center; 
        padding: 0; 
        color: var(--text); 
    }
    
    /* Kontainer sekarang memenuhi layar */
    .container { 
        background: #fff; 
        width: 100%; 
        max-width: 100%; 
        min-height: 100vh; 
        padding: 40px 20px; 
        text-align: center; 
        position: relative; 
        overflow-y: auto; 
        display: flex;
        flex-direction: column;
    }
    .container::before { content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 8px; background: linear-gradient(90deg, var(--primary), var(--secondary)); }
    
    .header-nav { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; font-size: 0.9rem; width: 100%; max-width: 600px; margin-left: auto; margin-right: auto; }
    .user-badge { background: #fce7f3; padding: 8px 15px; border-radius: 20px; color: var(--primary-dark); font-weight: 600; }
    .nav-link { color: var(--primary-dark); text-decoration: none; font-weight: 600; margin-left: 10px; cursor: pointer; }
    h1 { font-size: 2rem; margin-bottom: 10px; color: var(--primary-dark); }
    .subtitle { font-size: 0.9rem; color: #db2777; margin-bottom: 30px; }
    
    .form-group { margin-bottom: 15px; text-align: left; max-width: 400px; width: 100%; margin-left: auto; margin-right: auto; }
    label { display: block; margin-bottom: 5px; color: #831843; font-weight: 600; font-size: 0.9rem; }
    input { width: 100%; padding: 12px 15px; border: 2px solid #fbcfe8; border-radius: 10px; font-size: 1rem; color: #831843; outline: none; transition: 0.3s; }
    input:focus { border-color: var(--primary); }
    .btn { width: 100%; max-width: 400px; padding: 12px; background: var(--primary); color: #fff; border: none; border-radius: 10px; font-size: 1rem; font-weight: 600; cursor: pointer; transition: 0.3s; margin-top: 10px; margin-left: auto; margin-right: auto; display: block; }
    .btn:hover { background: var(--primary-dark); transform: translateY(-2px); box-shadow: 0 5px 15px rgba(236, 72, 153, 0.3); }

    .group-grid { display: grid; grid-template-columns: 1fr; gap: 15px; margin-top: 20px; max-width: 400px; width: 100%; margin-left: auto; margin-right: auto; }
    .group-card { display: block; background: #fce7f3; border: 2px solid #f9a8d4; padding: 20px; border-radius: 16px; text-decoration: none; color: var(--primary-dark); transition: all 0.3s ease; cursor: pointer; }
    .group-card:hover { background: var(--primary); color: #fff; border-color: var(--primary); transform: translateY(-3px); box-shadow: 0 10px 20px rgba(236, 72, 153, 0.2); }
    .group-card h3 { font-size: 1.2rem; margin-bottom: 5px; }
    .group-card p { font-size: 0.8rem; opacity: 0.9; }

    .score-board { display: flex; justify-content: space-between; background: #fce7f3; padding: 15px 20px; border-radius: 12px; margin-bottom: 15px; font-weight: 600; color: var(--primary-dark); max-width: 400px; width: 100%; margin-left: auto; margin-right: auto; }
    .score-board span { color: var(--primary); font-weight: 800; }
    
    .timer-bar { background: var(--primary); color: white; padding: 15px; border-radius: 12px; margin-bottom: 25px; font-size: 1.8rem; font-weight: 800; transition: all 0.3s ease; max-width: 400px; width: 100%; margin-left: auto; margin-right: auto; }
    .timer-bar.warning { background: var(--danger); animation: pulse 1s infinite; }
    @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.05); } 100% { transform: scale(1); } }
    
    .question-box { margin-bottom: 30px; max-width: 400px; width: 100%; margin-left: auto; margin-right: auto; }
    .question-label { font-size: 0.9rem; color: #db2777; margin-bottom: 10px; }
    .question-text { font-size: 2rem; font-weight: 700; color: var(--primary-dark); padding: 20px; background: #fce7f3; border-radius: 16px; border: 2px dashed #f9a8d4; word-wrap: break-word; }
    
    .options-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; max-width: 400px; width: 100%; margin-left: auto; margin-right: auto; }
    .option-btn { background: #fff; border: 2px solid #fbcfe8; padding: 18px 10px; border-radius: 12px; font-family: 'Noto Sans JP', sans-serif; font-size: clamp(1rem, 4vw, 1.4rem); font-weight: 700; color: var(--text); cursor: pointer; transition: all 0.2s ease; word-break: break-all; }
    .option-btn:hover:not(:disabled) { border-color: var(--primary); color: var(--primary); transform: translateY(-2px); box-shadow: 0 5px 15px rgba(236, 72, 153, 0.2); background: #fff0f8; }
    .option-btn.correct { background: var(--success); border-color: var(--success); color: #fff; animation: pop 0.3s ease; }
    .option-btn.wrong { background: var(--danger); border-color: var(--danger); color: #fff; animation: shake 0.4s ease; }
    @keyframes pop { 0% { transform: scale(1); } 50% { transform: scale(1.05); } 100% { transform: scale(1); } }
    @keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-5px); } 75% { transform: translateX(5px); } }
    
    .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(131, 24, 67, 0.6); backdrop-filter: blur(5px); display: none; justify-content: center; align-items: center; z-index: 100; animation: fadeIn 0.3s ease; padding: 20px; }
    .modal-overlay.active { display: flex; }
    .modal-box { background: #fff; padding: 40px 30px; border-radius: 20px; text-align: center; max-width: 380px; width: 90%; animation: slideUp 0.4s ease; border-top: 8px solid var(--danger); }
    .modal-icon { font-size: 3.5rem; margin-bottom: 15px; }
    .modal-title { font-size: 1.5rem; font-weight: 800; color: var(--danger); margin-bottom: 10px; }
    .modal-text { font-size: 1rem; color: #64748b; margin-bottom: 25px; line-height: 1.5; }
    .modal-text b { font-family: 'Noto Sans JP', sans-serif; color: var(--primary-dark); font-size: 1.2rem; }
    .modal-btn { background: var(--primary); color: #fff; border: none; padding: 12px 30px; border-radius: 10px; font-size: 1rem; font-weight: 600; cursor: pointer; transition: 0.2s; box-shadow: 0 4px 10px rgba(236, 72, 153, 0.3); text-decoration: none; display: inline-block; margin: 5px; }
    .modal-btn:hover { background: var(--primary-dark); transform: translateY(-2px); }
    .modal-btn.success { background: var(--success); box-shadow: 0 4px 10px rgba(16, 185, 129, 0.3); }
    .modal-btn.success:hover { background: #059669; }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    @keyframes slideUp { from { transform: translateY(50px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
    
    .copyright { margin-top: auto; padding-top: 20px; font-size: 0.75rem; color: #db2777; opacity: 0.7; font-weight: 600; letter-spacing: 0.5px; }

    table { width: 100%; border-collapse: collapse; margin-bottom: 20px; max-width: 600px; margin-left: auto; margin-right: auto; }
    th, td { padding: 12px 10px; text-align: center; border-bottom: 1px solid #fce7f3; font-size: 0.9rem; }
    th { background: #fce7f3; color: var(--primary-dark); }
    .review-item { background: #fff; border: 2px solid #fee2e2; border-radius: 12px; padding: 15px; margin-bottom: 15px; max-width: 600px; margin-left: auto; margin-right: auto; }
    .question-row { font-weight: 600; margin-bottom: 10px; color: #831843; }
    .answer-row { display: flex; justify-content: space-between; padding: 8px 0; border-top: 1px dashed #fbcfe8; font-family: 'Noto Sans JP', sans-serif; }
    .wrong-text { color: var(--danger); font-weight: 700; text-decoration: line-through; }
    .correct-text { color: var(--success); font-weight: 700; }
    .label-tag { font-size: 0.75rem; color: #64748b; font-family: 'Poppins', sans-serif; display: block; margin-bottom: 3px; }
</style>
</head>
<body>

                let reviewHtml = '';
                if (record.wrong_answers.length === 0) {
                    reviewHtml = `<div class="empty" style="text-align: center; padding: 30px; background: #f0fdf4; border-radius: 12px; border: 1px solid #bbf7d0; color: #10b981; font-weight: 600;">🎉 Sempurna! Kamu tidak menjawab salah sama sekali!</div>`;
                } else {
                    record.wrong_answers.forEach((wa, idx) => {
                        reviewHtml += `
                            <div class="review-item">
                                <div class="question-row">${idx + 1}. ${wa.question}</div>
                                <div class="answer-row">
                                    <div>
                                        <span class="label-tag">Jawaban Kamu (Salah)</span>
                                        <span class="wrong-text">${wa.user_answer}</span>
                                    </div>
                                    <div style="text-align: right;">
                                        <span class="label-tag">Jawaban Benar</span>
                                        <span class="correct-text">${wa.correct_answer}</span>
                                    </div>
                                </div>
                            </div>
                        `;
                    });
                }

                html = `
                    <div class="header-nav">
                        <div class="user-badge">👤 ${currentName}</div>
                        <div><a class="nav-link" onclick="showView('history')">Kembali</a></div>
                    </div>
                    <h1>📝 Pembahasan</h1>
                    <p class="subtitle">${record.played_at}</p>
                    <div class="score-banner" style="background: #fce7f3; padding: 15px; border-radius: 12px; text-align: center; margin-bottom: 25px; font-weight: 800; font-size: 1.2rem; color: var(--primary-dark);">
                        Nilai: ${record.score} / ${record.total}
                    </div>
                    ${reviewHtml}
                `;
            }

            appView.innerHTML = html;
        }

        function doLogin() {
            const name = document.getElementById('nameInput').value.trim();
            if (!name) { alert('Masukkan nama dulu!'); return; }
            currentName = name;
            localStorage.setItem('tebak_jepang_name', name);
            showView('groups');
        }

        function logout() {
            localStorage.removeItem('tebak_jepang_name');
            currentName = '';
            showView('login');
        }

        function clearHistory() {
            if(confirm('Yakin mau hapus semua riwayat nilai?')) {
                localStorage.removeItem('tebak_jepang_history');
                showView('history');
            }
        }

        function startQuiz(group) {
            selectedGroup = group;
            showView('quiz');
        }

        function startQuizEngine(vocabData) {
            score = 0; wrongAnswers = []; currentQuestionIndex = 0;
            quizPool = [...vocabData].sort(() => Math.random() - 0.5);
            loadQuestion();
        }

        function loadQuestion() {
            if (currentQuestionIndex >= quizPool.length) { finishGame(); return; }
            answered = false;
            currentQuestion = quizPool[currentQuestionIndex];
            document.getElementById('question').textContent = currentQuestion.id;
            document.getElementById('question-num').textContent = currentQuestionIndex + 1;
            document.getElementById('total-q').textContent = quizPool.length;
            document.getElementById('score').textContent = score;

            let options = [currentQuestion];
            while(options.length < 4) {
                let r = quizPool[Math.floor(Math.random() * quizPool.length)];
                if(!options.includes(r)) options.push(r);
            }
            options = options.sort(() => Math.random() - 0.5);
            
            const optionsEl = document.getElementById('options');
            optionsEl.innerHTML = '';
            options.forEach(option => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.textContent = option.jp;
                btn.onclick = () => checkAnswer(option, btn);
                optionsEl.appendChild(btn);
            });
            startTimer();
        }

        function checkAnswer(selectedOption, btn) {
            if(answered) return;
            answered = true;
            stopTimer();

            if(selectedOption.jp === currentQuestion.jp) {
                btn.classList.add('correct');
                score++;
                document.getElementById('score').textContent = score;
                currentQuestionIndex++;
                setTimeout(loadQuestion, 1000);
            } else {
                btn.classList.add('wrong');
                document.getElementById('alertIcon').textContent = "❌";
                document.getElementById('alertTitle').textContent = "Jawaban Salah!";
                document.getElementById('correctAnswer').textContent = currentQuestion.jp;
                wrongAnswers.push({ question: currentQuestion.id, correct_answer: currentQuestion.jp, user_answer: selectedOption.jp });
                setTimeout(() => alertModal.classList.add('active'), 500);
            }
        }

        function startTimer() {
            clearInterval(timerInterval);
            timeLeft = 15;
            document.getElementById('timer').textContent = timeLeft;
            const timerBar = document.getElementById('timer-bar');
            timerBar.classList.remove('warning');
            
            timerInterval = setInterval(() => {
                timeLeft--;
                document.getElementById('timer').textContent = timeLeft;
                if (timeLeft <= 5) timerBar.classList.add('warning');
                if (timeLeft <= 0) {
                    clearInterval(timerInterval);
                    handleTimeout();
                }
            }, 1000);
        }

        function stopTimer() { clearInterval(timerInterval); }

        function handleTimeout() {
            if(answered) return;
            answered = true;
            wrongAnswers.push({ question: currentQuestion.id, correct_answer: currentQuestion.jp, user_answer: "Waktu Habis" });
            document.getElementById('alertIcon').textContent = "⏰";
            document.getElementById('alertTitle').textContent = "Waktu Habis!";
            document.getElementById('correctAnswer').textContent = currentQuestion.jp;
            setTimeout(() => alertModal.classList.add('active'), 300);
        }

        document.getElementById('retryBtn').addEventListener('click', () => {
            alertModal.classList.remove('active');
            currentQuestionIndex++;
            loadQuestion();
        });

        function finishGame() {
            stopTimer();
            document.getElementById('finalScore').textContent = score + " / " + quizPool.length;
            
            // Save to LocalStorage
            const history = getHistory();
            history.push({
                id: 'game_' + Date.now(),
                name: currentName,
                score: score,
                total: quizPool.length,
                group_type: selectedGroup,
                played_at: new Date().toLocaleString('id-ID', { dateStyle: 'medium', timeStyle: 'short' }),
                wrong_answers: wrongAnswers
            });
            saveHistory(history);
            
            finishModal.classList.add('active');
        }

        // Init
        if (!localStorage.getItem('tebak_jepang_name')) {
            showView('login');
        } else {
            currentName = localStorage.getItem('tebak_jepang_name');
            showView('groups');
        }
    </script>
</body>
</html>
